services:
  postgres:
    image: postgres:17
    container_name: business-task-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_management
      POSTGRES_USER: task_manager
      POSTGRES_PASSWORD: task_manager_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: