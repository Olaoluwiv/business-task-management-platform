<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>TaskFlow</h1>

            <p>Business Task Management Platform</p>

            <form id="login-form">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    required
                >

                <button type="submit">
                    Login
                </button>

                <p id="login-error"></p>

            </form>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
